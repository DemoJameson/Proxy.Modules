<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Trakt 翻译管理后台</title>
        <meta name="robots" content="noindex" />
        <link rel="icon" type="image/webp" href="/trakt.webp" />
        <link rel="stylesheet" href="/admin.css" />
    </head>
    <body>
        <dialog
            id="tokenDialog"
            class="token-dialog"
            aria-labelledby="tokenDialogTitle"
            aria-describedby="tokenDialogDescription"
        >
            <form id="tokenDialogForm" method="dialog">
                <h2 id="tokenDialogTitle">管理员验证</h2>
                <p id="tokenDialogDescription">请输入 ADMIN_TOKEN 后进入翻译管理后台。出于安全考虑，刷新页面后需要重新输入。</p>
                <label for="tokenDialogInput">ADMIN_TOKEN</label>
                <input
                    id="tokenDialogInput"
                    type="password"
                    autocomplete="off"
                    autofocus
                    aria-describedby="tokenDialogError"
                    aria-invalid="false"
                />
                <div id="tokenDialogError" class="dialog-error" role="alert" aria-atomic="true"></div>
                <div class="token-dialog-actions">
                    <button id="unlockAdmin" class="primary" type="submit">进入管理后台</button>
                </div>
            </form>
        </dialog>

        <dialog id="confirmDialog" class="token-dialog" aria-labelledby="confirmTitle" aria-describedby="confirmMessage">
            <form method="dialog">
                <h2 id="confirmTitle">确认操作</h2>
                <p id="confirmMessage"></p>
                <div class="token-dialog-actions">
                    <button type="submit" value="cancel" autofocus>取消</button>
                    <button id="confirmAccept" class="danger" type="submit" value="confirm">确认</button>
                </div>
            </form>
        </dialog>

        <main id="appShell" class="shell">
            <header class="topbar">
                <h1>Trakt 翻译管理后台</h1>
            </header>

            <section class="layout">
                <div class="surface">
                    <form id="filters" class="filters">
                        <div class="filter-grid">
                            <label class="filter-field" for="query">
                                <span class="filter-label">搜索</span>
                                <input id="query" type="search" placeholder="ID / 标题" />
                            </label>
                            <label class="filter-field" for="type">
                                <span class="filter-label">媒体类型</span>
                                <select id="type" aria-label="媒体类型">
                                    <option value="all">全部</option>
                                    <option value="movies">电影</option>
                                    <option value="shows">剧集</option>
                                    <option value="episodes">单集</option>
                                </select>
                            </label>
                            <label class="filter-field" for="locale">
                                <span class="filter-label">中文地区</span>
                                <select id="locale" aria-label="中文地区">
                                    <option value="cn">简体</option>
                                    <option value="tw">繁体（台湾）</option>
                                    <option value="hk">繁体（香港）</option>
                                </select>
                            </label>
                            <label class="filter-field" for="override">
                                <span class="filter-label">覆盖状态</span>
                                <select id="override" aria-label="覆盖状态">
                                    <option value="all">全部</option>
                                    <option value="overridden">已覆盖</option>
                                    <option value="original">未覆盖</option>
                                </select>
                            </label>
                        </div>
                    </form>
                    <div class="list-head">
                        <span id="listMeta" class="meta">未加载</span>
                        <span id="listStatus" class="status" aria-live="polite"></span>
                    </div>
                    <div id="rows" class="rows"><div class="empty-state">输入 ID / 标题或点击筛选后查询</div></div>
                    <div id="loadMoreWrap" class="list-foot" hidden>
                        <button id="loadMore" type="button" disabled>加载更多</button>
                    </div>
                </div>

                <div class="surface editor">
                    <div class="editor-head">
                        <span class="editor-title-line">
                            <strong id="editorTitle">未选择条目</strong>
                            <span class="editor-meta">
                                <span id="editorMeta" class="meta"></span>
                                <span id="expiresMeta" class="meta expiry-meta"></span>
                                <span id="overrideHint" class="meta override-hint" hidden></span>
                            </span>
                        </span>
                        <span class="editor-tools">
                            <span id="status" class="status" aria-live="polite"></span>
                            <a
                                id="traktLink"
                                class="external-link icon-only"
                                href="https://app.trakt.tv"
                                target="_blank"
                                rel="noreferrer"
                                aria-label="打开 Trakt"
                                title="打开 Trakt"
                                hidden
                            >
                                <img class="trakt-icon" src="/trakt.webp" alt="Trakt" width="18" height="18" decoding="async" />
                            </a>
                        </span>
                    </div>
                    <div class="editor-body">
                        <div id="editorEmpty" class="empty-state">从左侧选择翻译条目</div>
                        <form id="editorForm" hidden>
                            <div class="field-grid">
                                <div class="field">
                                    <div>
                                        <label for="titleInput">标题</label>
                                        <input id="titleInput" />
                                    </div>
                                    <label class="lock"><input id="titleOverride" type="checkbox" /> 覆盖标题</label>
                                </div>
                                <div class="field">
                                    <div>
                                        <label for="overviewInput">简介</label>
                                        <textarea id="overviewInput"></textarea>
                                    </div>
                                    <label class="lock"><input id="overviewOverride" type="checkbox" /> 覆盖简介</label>
                                </div>
                                <div class="field">
                                    <div>
                                        <label for="taglineInput">标语</label>
                                        <input id="taglineInput" />
                                    </div>
                                    <label class="lock"><input id="taglineOverride" type="checkbox" /> 覆盖标语</label>
                                </div>
                            </div>

                            <div class="actions">
                                <button id="saveTranslation" class="primary" type="submit">保存修改</button>
                                <button id="deleteOverride" type="button">清除覆盖</button>
                                <button id="deleteAll" class="danger" type="button">删除翻译</button>
                            </div>

                            <div class="compare">
                                <div>
                                    <span class="compare-label">当前翻译</span>
                                    <pre id="effectiveView"></pre>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </main>

        <script src="/admin.js"></script>
    </body>
</html>
